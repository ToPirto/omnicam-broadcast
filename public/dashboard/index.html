<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniCam Dashboard</title>
  <style>
    body { font-family: sans-serif; background: #0a0a0c; color: #fff; padding: 20px; }
    header { border-bottom: 1px solid #2a2a32; padding-bottom: 10px; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .card { background: #16161a; border-radius: 8px; padding: 15px; border: 1px solid #2a2a32; }
    .card.add-cam { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    button { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
    button:hover { background: #0056b3; }
    #qr-container img { max-width: 100%; border-radius: 8px; margin-top: 10px; }
    .warning-link { color: #ffc107; text-decoration: none; display: inline-block; margin-top: 10px; }

    .brand-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .brand-logo-text { font-family: sans-serif; font-weight: 900; font-size: 24px; letter-spacing: 6px; color: #fff; text-transform: uppercase; }
    .brand-pill { background: #1a1a1a; border: 1px solid #333; padding: 2px 8px; border-radius: 12px; font-family: monospace; font-size: 10px; letter-spacing: 2px; color: #aaa; }
    .brand-dot { width: 8px; height: 8px; background: #ff3b30; border-radius: 50%; box-shadow: 0 0 6px #ff3b30; }

    .led-meter-container { display: flex; gap: 2px; align-items: center; background: #111115; padding: 4px; border-radius: 4px; border: 1px solid #000; box-shadow: inset 0 2px 4px rgba(0,0,0,0.8); width: fit-content; margin-bottom: 10px; }
    .led-segment { width: 6px; height: 14px; background: #1e1e24; border-radius: 2px; transition: background-color 0.1s; }
    .led-text { font-family: monospace; font-size: 10px; font-weight: bold; margin-right: 6px; color: #8e8e93; min-width: 35px; text-align: center; }
    .led-segment.active-green { background: #34c759; box-shadow: 0 0 4px #34c759; }
    .led-segment.active-yellow { background: #ffd600; box-shadow: 0 0 4px #ffd600; }
    .led-segment.active-red { background: #ff3b30; box-shadow: 0 0 4px #ff3b30; }
  </style>
</head>
<body>
  <header>
    <div class="brand-logo">
      <div class="brand-dot"></div>
      <div class="brand-logo-text">OMNICAM</div>
      <div class="brand-pill">BROADCAST</div>
    </div>
    <p>Server: <span id="server-url"></span> <span id="obs-status"></span></p>
    <a href="/cert-warning/" class="warning-link" target="_blank">Pertama kali? Baca panduan sertifikat -&gt;</a>
    
    <div style="margin-top: 15px; background: #16161a; padding: 15px; border-radius: 8px; border: 1px solid #2a2a32;">
      <h3>OBS WebSocket Settings</h3>
      <input type="text" id="obs-url" placeholder="ws://127.0.0.1:4455" style="padding: 8px; margin-right: 10px; width: 250px;">
      <input type="password" id="obs-pwd" placeholder="Password" style="padding: 8px; margin-right: 10px;">
      <button id="btn-save-settings">Simpan & Reconnect OBS</button>
    </div>
  </header>

  <div class="grid" id="cam-grid">
    <div class="card add-cam">
      <h3>Tambah Kamera</h3>
      <button id="btn-add">Buat QR Code</button>
      <div id="qr-container"></div>
      <p style="font-size: 0.9em; color: #aaa; margin-top: 10px;">Scan QR ini dengan HP kamu</p>
    </div>
  </div>

  <script type="module" src="/dashboard/dashboard.js"></script>
</body>
</html>
