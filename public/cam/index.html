<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OmniCam Sender</title>
  <link rel="manifest" href="/cam/manifest.json">
  <link rel="stylesheet" href="/cam/sender.css">
</head>
<body>
  <div id="tally-border" class="tally-grey"></div>
  <div id="grid-overlay" class="grid-overlay" style="display:none;"></div>
  <div class="video-container" id="video-container">
    <video id="preview" autoplay muted playsinline></video>
    
    <!-- Focus Reticle -->
    <div id="focus-reticle" class="focus-reticle" style="display:none;">
      <div class="reticle-box"></div>
      <div class="reticle-text">[AF LOCK]</div>
    </div>
  </div>
  
  <!-- Zoom Slider -->
  <div id="zoom-container" class="zoom-container" style="display:none;">
    <input type="range" id="zoom-slider" orient="vertical" step="0.1">
    <div id="zoom-text" class="mono-text">1.0x</div>
  </div>

  <div class="hud-top">
    <div class="top-left">
      <div class="brand-logo">
        <div class="brand-dot"></div>
        <div class="brand-logo-text">OMNICAM</div>
        <div class="brand-pill">BROADCAST</div>
      </div>
      <div class="cam-name" id="cam-name-display">CAM 1</div>
      <div class="status-dot" id="status-dot"></div>
    </div>
    <div class="top-right">
      <div id="battery-container" class="battery-container" title="Battery">
        <div class="battery-body">
          <div id="battery-level" class="battery-level"></div>
        </div>
        <div class="battery-nipple"></div>
        <div id="battery-text" class="mono-text battery-text">--%</div>
      </div>
      <div id="clock" class="mono-text">00:00:00</div>
      <div id="status" class="mono-text"><span class="lang-id">Menunggu...</span><span class="lang-en" style="display:none;">Waiting...</span></div>
      <button id="btn-pro-menu" class="btn-flat btn-menu">[MENU]</button>
    </div>
  </div>

  <div class="pro-menu-panel" id="pro-menu-panel" style="display:none;">
    <div class="menu-header">
      <strong class="lang-id">Pengaturan Pro</strong>
      <strong class="lang-en" style="display:none;">Pro Settings</strong>
      <button id="btn-close-menu" class="btn-flat">X</button>
    </div>
    <div class="menu-item">
      <span class="lang-id">Bahasa</span><span class="lang-en" style="display:none;">Language</span>
      <button id="btn-lang-toggle" class="btn-flat">ID</button>
    </div>
    <div class="menu-item">
      <span class="lang-id">Grid 3x3</span><span class="lang-en" style="display:none;">3x3 Grid</span>
      <button id="btn-grid-toggle" class="btn-flat">OFF</button>
    </div>
    <!-- Re-use the existing setup panel items but placed elegantly -->
    <div class="menu-item">
      <span class="lang-id">Lensa</span><span class="lang-en" style="display:none;">Lens</span>
      <select id="cam-select"></select>
    </div>
    <div class="menu-item">
      <span class="lang-id">Resolusi</span><span class="lang-en" style="display:none;">Resolution</span>
      <select id="quality-preset">
        <option value="720p30_2500">720p30 (2.5 Mbps)</option>
        <option value="1080p30_5000" selected>1080p30 (5.0 Mbps)</option>
        <option value="1080p60_8000">1080p60 (8.0 Mbps)</option>
      </select>
    </div>
    <div class="menu-item-audio">
      <label><input type="checkbox" id="chk-echo"> Echo</label>
      <label><input type="checkbox" id="chk-noise"> Noise</label>
      <label><input type="checkbox" id="chk-agc"> AGC</label>
    </div>
  </div>

  <div class="setup-panel" id="setup-panel">
    <button id="btn-start">
      <span class="lang-id">Mulai Kamera</span>
      <span class="lang-en" style="display:none;">Start Camera</span>
    </button>
  </div>

  <div class="hud-bottom">
    <div class="monitor-bar">
      <div id="audio-meter" class="led-meter-container">
        <span class="led-text" id="audio-text">MIC</span>
        <!-- 16 segments generated by JS -->
      </div>
      <div id="telemetry-badges" class="telemetry-badges">
        <div class="telemetry-chip" id="chip-res">[ -- ]</div>
        <div class="telemetry-chip" id="chip-bitrate">[ 0.0 Mbps ]</div>
        <div class="telemetry-chip" id="chip-loss">[ LOSS: 0 ]</div>
      </div>
    </div>
    <div class="action-buttons">
      <button id="btn-mute" style="display:none;" class="btn-flat">MUTE</button>
      <button id="btn-powersave" style="display:none;" class="btn-flat">[BATTERY SAVER]</button>
      <button id="btn-disconnect" style="display:none;" class="btn-flat btn-danger">PUTUS</button>
    </div>
  </div>
  
  <div id="powersave-overlay" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:black; z-index:9999; flex-direction:column; justify-content:center; align-items:center;">
    <div id="powersave-tally" style="position:absolute; top:0; left:0; right:0; bottom:0; border: 5px solid #555; pointer-events:none;"></div>
    <div style="color:white; font-size:24px; margin-bottom: 20px;">
      <span id="powersave-battery">Bat: --</span> | <span id="powersave-bitrate">0 kbps</span>
    </div>
    <div style="color:#777; user-select:none;" class="lang-id">Tahan 2 detik untuk bangun</div>
    <div style="color:#777; user-select:none; display:none;" class="lang-en">Hold 2 seconds to wake</div>
  </div>
  
  <div id="diagnostics-panel" style="position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.8); color: #0f0; font-family: monospace; font-size: 10px; max-height: 40%; overflow-y: auto; padding: 10px; display: none; z-index: 1000;">
    <button id="btn-close-diag" style="float: right; background: #333; color: white; border: none; padding: 5px;">Tutup</button>
    <div id="diagnostics-content"></div>
  </div>
  <button id="btn-toggle-diag" style="position: absolute; bottom: 10px; right: 10px; z-index: 999; background: rgba(0,0,0,0.5); color: white; border: none; padding: 5px; font-size: 10px; border-radius: 3px;">Diag</button>

  <script type="module" src="/cam/sender.js"></script>
</body>
</html>
